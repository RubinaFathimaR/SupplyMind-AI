version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supplymind-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: supplymind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplymind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/supplymind
      - SECRET_KEY=supplymind-super-secret-capstone-key-2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_index:/app/faiss_index

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplymind-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
